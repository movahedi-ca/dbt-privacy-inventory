# Public artifact policy: what may leave the build plane.
# Anything not listed here stays restricted (logs, manifest, db, compiled SQL).
# First publication and every new dataset family require human review.
# Location-aware contract (playbook sections 6.1 and 6.2, TASK-035):
# the public set is exactly the four locations below and no others.
# current.json and index.json live at the releases root only.
# release.json and public_graph.json live in a release folder only.
allowlist:
  - path: public/dbt/releases/current.json
    location: releases_root
    file: current.json
  - path: public/dbt/releases/index.json
    location: releases_root
    file: index.json
  - path: public/dbt/releases/<release-id>/release.json
    location: release_folder
    file: release.json
  - path: public/dbt/releases/<release-id>/public_graph.json
    location: release_folder
    file: public_graph.json
forbid:
  - docs/index.html
  - docs/assets/**
  - data-quality-summary.json
  - manifest.json (raw; only the sanitized public_graph.json goes out)
  - catalog.json (raw; only via the reviewed docs bundle)
  - "*.duckdb"
  - "*.log"
  - compiled SQL
  - source file paths
  - usernames, environment values, credentials
  - row samples, warehouse names
  - arbitrary HTML in labels (encode as text)
limits:
  max_graph_nodes: 500
  max_graph_edges: 2000
  max_graph_depth: 10
  max_label_chars: 200
  max_bundle_bytes: 5000000
scan:
  - secrets (api keys, passwords, tokens, private keys)
  - personal data (emails, phones, real names, IPs, real cookie IDs)
  - absolute paths and home-directory paths
