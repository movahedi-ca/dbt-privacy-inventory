name: dbt_privacy_inventory
version: 0.1.0
config-version: 2
profile: dbt_privacy_inventory

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "work"

models:
  dbt_privacy_inventory:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    # TASK-011 shadow families (playbook V4, D-04 shadow only).
    # Disabled unless DBT_SHADOW_ENABLED=true, so the production
    # nightly build node set is unchanged.
    shadow:
      +materialized: table
      +enabled: "{{ env_var('DBT_SHADOW_ENABLED', 'false') | as_bool }}"

seeds:
  dbt_privacy_inventory:
    +quote_columns: false
    shadow:
      +enabled: "{{ env_var('DBT_SHADOW_ENABLED', 'false') | as_bool }}"
      shadow_src_law25:
        +column_types:
          weight: double
      shadow_src_enforcement:
        +column_types:
          penalty_cad: double
